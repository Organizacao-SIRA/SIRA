# Docker Compose — APENAS INFRAESTRUTURA.
#
# Backend (NestJS) e Frontend (React/Vite) NÃO sobem aqui: rodam localmente
# na máquina do dev com hot reload nativo (veja o README → "Como Executar").
# Este arquivo provê somente os serviços de infra: PostgreSQL e, opcionalmente,
# o pgAdmin.
services:
  # Banco de Dados PostgreSQL
  postgres:
    image: postgres:17-alpine
    container_name: sira-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sira_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sira_password}
      POSTGRES_DB: ${POSTGRES_DB:-sira_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Verifica se o banco está pronto para aceitar conexões
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sira_user} -d $${POSTGRES_DB:-sira_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - sira-network

  # pgAdmin - Interface gráfica para o PostgreSQL (opcional)
  # Para subir: docker compose --profile tools up -d pgadmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sira-pgadmin
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sira.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - sira-network
    restart: always

networks:
  sira-network:
    driver: bridge

volumes:
  postgres_data:
