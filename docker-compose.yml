services:
  # Banco de Dados PostgreSQL
  postgres:
    image: postgres:17-alpine
    container_name: sira-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sira_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sira_password}
      POSTGRES_DB: ${POSTGRES_DB:-sira_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Verifica se o banco está pronto para aceitar conexões
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sira_user} -d $${POSTGRES_DB:-sira_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - sira-network

  # API Backend (NestJS)
  backend:
    build:
      context: ./sira-backend
      dockerfile: Dockerfile
      target: development
    container_name: sira-backend
    env_file:
      - ./sira-backend/.env
    environment:
      DATABASE_URL: postgresql://sira_user:sira_password@postgres:5432/sira_db?schema=public
      PORT: 3000
      NODE_ENV: development
    ports:
      - "3002:3000"
    volumes:
      - ./sira-backend/src:/app/src
      - ./sira-backend/prisma:/app/prisma
      - /app/node_modules # Garante que as dependências do container não sejam sobrescritas
    depends_on:
      postgres:
        condition: service_healthy # Aguarda o healthcheck do postgres passar
    networks:
      - sira-network
    restart: always

  # Aplicação Frontend (React + Vite)
  frontend:
    build:
      context: ./sira-frontend
      dockerfile: Dockerfile
      target: development
    container_name: sira-frontend
    env_file:
      - ./sira-frontend/.env
    environment:
      VITE_API_URL: http://localhost:3002
    ports:
      - "5173:5173"
    volumes:
      - ./sira-frontend/src:/app/src
      - ./sira-frontend/public:/app/public
      - /app/node_modules # Evita que a node_modules local apague a do container
    networks:
      - sira-network
    restart: always

networks:
  sira-network:
    driver: bridge

volumes:
  postgres_data:
